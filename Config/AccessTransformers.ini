[AccessTransformers]
; Hooks SweepRailroadPositions so trains can pass through each other.
Friend=(Class="AFGRailroadSubsystem", FriendClass="FATHooks")
; Scales locomotive traction and power draw for the acceleration setting.
Friend=(Class="UFGRailroadVehicleMovementComponent", FriendClass="AATTrafficSubsystem")
Friend=(Class="UFGLocomotiveMovementComponent", FriendClass="AATTrafficSubsystem")
Friend=(Class="AFGLocomotive", FriendClass="AATTrafficSubsystem")
; Reads the station a docked train is at, for the planner's dwell times; starts the long-wait warning of a deadlocked
; train.
Friend=(Class="AFGTrain", FriendClass="AATTrafficSubsystem")
